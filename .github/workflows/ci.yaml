name: Checking CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  check:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Type check
        run: pnpm typecheck
      - name: Run tests
        run: pnpm test
      - name: Verify published package
        run: |
          pnpm --filter text-search-engine pack --pack-destination /tmp/text-search-engine-package
          cd packages/text-search-engine
          node scripts/verify-package.mjs /tmp/text-search-engine-package/text-search-engine-*.tgz ../../node_modules/.bin/tsc
